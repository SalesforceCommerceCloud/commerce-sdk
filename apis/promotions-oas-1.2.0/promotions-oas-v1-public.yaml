          enabled: true
          schedule: {}
          scheduleType: none
        creationDate: '2020-01-09T16:50:32.000Z'
        disableGloballyExcluded: false
        enabled: true
        exclusivity: 'no'
        id: my-shipping-promotion
        lastModified: '2020-01-09T16:50:32.000Z'
        name:
